services:
  postgres:
    image: postgres:17-alpine
    container_name: takwene-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: track_management
      POSTGRES_USER: track_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: